<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Antidupe</title>
<meta name="description" content="Door counter for Roblox DOORS: always know which room you are in.">
<meta name="theme-color" content="#0b0908">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Antidupe">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="assets/doors.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{
  font-family:"DoorsRevamped";
  src:url("assets/doors.woff2") format("woff2"),url("assets/doors.ttf") format("truetype");
  font-display:block;
}
:root{
  /* 1u = 1 CSS px on an iPad Air in landscape (1180 x 820). Everything scales from it. */
  --u:min(calc(100vw / 1180), calc(100vh / 820));
  --u:min(calc(100vw / 1180), calc(100dvh / 820));
  --ink:#ffffff;
  --dim:rgba(255,255,255,.27);
  --pill:#ffffff;
  --pill-ink:#000000;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
@media (orientation:portrait){
  :root{
    --u:min(calc(100vw / 820), calc(100vh / 1180));
    --u:min(calc(100vw / 820), calc(100dvh / 1180));
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#0b0908;overflow:hidden;overscroll-behavior:none}
body{
  font-family:"DoorsRevamped",system-ui,sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:manipulation;
}

/* backgrounds: two stacked layers that cross-fade */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.bg i{
  position:absolute;inset:-2%;background:center/cover no-repeat;opacity:0;
  transition:opacity .6s ease;
}
.bg i.on{opacity:1}
.bg::after{ /* scrim keeps white type readable on brighter rooms */
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(to bottom,rgba(0,0,0,.35),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 62%,rgba(0,0,0,.35)),
    rgba(0,0,0,var(--scrim,0));
  transition:background .6s ease;
}

.app{
  position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;
  padding:calc(49 * var(--u) + var(--safe-t)) calc(82 * var(--u) + var(--safe-r)) calc(82 * var(--u) + var(--safe-b)) calc(82 * var(--u) + var(--safe-l));
  opacity:0;transition:opacity .4s ease;
}
.app.ready{opacity:1}

.brand{display:block;height:calc(67 * var(--u));flex:none;touch-action:none}
.brand img{height:100%;width:auto;display:block;pointer-events:none;-webkit-user-drag:none}

.stage{
  display:flex;flex-direction:column;align-items:center;flex:none;
  margin-top:calc(38 * var(--u));
}
.stage canvas{display:block;width:auto;max-width:none;transition:opacity .12s ease}
#lbl{height:calc(38 * var(--s,1) * var(--u))}
#num{height:calc(178 * var(--s,1) * var(--u));margin-top:calc(24 * var(--s,1) * var(--u))}
#num.gg{height:calc(215 * var(--s,1) * var(--u))}
.room{
  margin-top:calc(26 * var(--s,1) * var(--u));min-height:calc(48 * var(--s,1) * var(--u));
  font-size:calc(36 * var(--s,1) * var(--u));line-height:calc(48 * var(--s,1) * var(--u));text-align:center;white-space:nowrap;
}

.next{
  margin-top:auto;margin-bottom:calc(27 * var(--u));text-align:center;color:var(--dim);
  min-height:calc(84 * var(--u));visibility:hidden;
}
.next.show{visibility:visible}
.next span{display:block;font-size:calc(32 * var(--u));line-height:calc(38 * var(--u))}
.next strong{display:block;font-weight:400;font-size:calc(39 * var(--u));line-height:calc(46 * var(--u))}

.go{
  flex:none;width:100%;height:calc(100 * var(--u));border:0;border-radius:calc(50 * var(--u));
  background:var(--pill);color:var(--pill-ink);
  font:400 calc(64 * var(--u))/1 "DoorsRevamped",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:0 calc(30 * var(--u));
  cursor:pointer;transition:transform .12s ease,filter .12s ease;
  white-space:nowrap;overflow:hidden;
}
.go:active{transform:scale(.985);filter:brightness(.88)}
.go:disabled{cursor:default;transform:none;filter:none}
.go:focus-visible{outline:calc(4 * var(--u)) solid #fff;outline-offset:calc(5 * var(--u))}
.go.small{font-size:calc(56 * var(--u))}

/* GG screen */
.app.gg .stage{margin-top:calc(112 * var(--u))}
.app.gg #lbl,.app.gg .room,.app.gg .next,.app.gg .go{display:none}

@media (orientation:portrait){
  .stage{--s:1.45;margin-top:calc(100vh * .09)}
  .app.gg .stage{margin-top:calc(100vh * .16)}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fade{opacity:0}
@media (prefers-reduced-motion:reduce){
  .bg i,.bg::after,.app,.stage canvas,.go{transition:none}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i id="bgA"></i><i id="bgB"></i></div>

<main class="app" id="app">
  <div class="brand" id="brand"><img src="assets/logo.png" alt="Antidupe"></div>

  <section class="stage">
    <canvas id="lbl" role="img" aria-label="Door"></canvas>
    <canvas id="num" role="img" aria-label="100"></canvas>
    <div class="room" id="room"></div>
  </section>

  <div class="next" id="next"><span>Next room is</span><strong id="nextName"></strong></div>

  <button class="go" id="go" type="button">OPEN THE DOOR</button>
</main>
<div class="sr" id="live" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };

  /* ---------- settings you may want to tweak ---------- */
  var START_DOOR      = 100;
  var CHASE_START     = 140;   // the door where the "let's start" button appears
  var CHASE_FIRST     = 141;   // first door shown when the chase starts
  var CHASE_END       = 150;   // door where the chase ends (counter reaches it)
  var CHASE_SECONDS   = 150;   // 2 min 30 s from pressing start to reaching door 150
  var LAST_DOOR       = 200;
  var STORE_KEY       = "antidupe:v1";

  /* ---------- special rooms ---------- */
  var SPECIAL = {100:"Generator room",101:"Minecart room",140:"Seek chase start",150:"Grumble nest",200:"Seek drain"};
  for (var d = 141; d <= 149; d++) SPECIAL[d] = "Seek chase";

  /* backgrounds by door range */
  var BGS = [[100,100,"100"],[101,101,"101"],[102,139,"102-139"],[140,140,"140"],[141,145,"141-145"],
             [146,149,"146-149"],[150,150,"150"],[151,199,"151-199"],[200,200,"200"]];
  var SCRIM = {"140":.15,"146-149":.2,"150":.2,"200":.5};
  function bgFor(door){
    for (var i=0;i<BGS.length;i++) if (door>=BGS[i][0] && door<=BGS[i][1]) return BGS[i][2];
    return "200";
  }

  /* ---------- state ---------- */
  var state = { door:START_DOOR, phase:"normal", chaseStart:0 };  // phase: normal | chase | gg

  function save(){
    try {
      if (state.phase === "gg") localStorage.removeItem(STORE_KEY);
      else localStorage.setItem(STORE_KEY, JSON.stringify(state));
    } catch(e){}
  }
  function load(){
    try {
      var s = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      if (s && typeof s.door === "number" && s.door >= START_DOOR && s.door <= LAST_DOOR &&
          (s.phase === "normal" || s.phase === "chase")) {
        state = { door:s.door, phase:s.phase, chaseStart:+s.chaseStart || 0 };
        if (state.phase === "chase" && !state.chaseStart) state = { door:CHASE_START, phase:"normal", chaseStart:0 };
      }
    } catch(e){}
  }

  /* ---------- the generator's text renderer (same flat + 3D warp code as the Text Generator) ---------- */
  var FAMILY = '"DoorsRevamped", sans-serif';
  var MAX_DIM = 16000;

  function flat(text, size){
    var probe = document.createElement("canvas").getContext("2d");
    probe.font = size + "px " + FAMILY;
    var m = probe.measureText(text || " ");
    var fa = m.fontBoundingBoxAscent || size*.8, fd = m.fontBoundingBoxDescent || size*.2;
    var widest = Math.max(1, m.width), lh = (fa+fd)*1.05, mg = Math.ceil(size*.06);
    var c = document.createElement("canvas");
    c.width  = Math.max(1, Math.min(Math.ceil(widest+mg*2), MAX_DIM));
    c.height = Math.max(1, Math.min(Math.ceil(lh+mg*2), MAX_DIM));
    var g = c.getContext("2d");
    g.font = size + "px " + FAMILY; g.fillStyle = "#fff"; g.textBaseline = "alphabetic"; g.textAlign = "center";
    g.fillText(text, mg + widest/2, mg + (lh-(fa+fd))/2 + fa);
    return c;
  }
  function sqToQuad(q){
    var x0=q[0],y0=q[1],x1=q[2],y1=q[3],x2=q[4],y2=q[5],x3=q[6],y3=q[7];
    var dx1=x1-x2,dx2=x3-x2,dx3=x0-x1+x2-x3,dy1=y1-y2,dy2=y3-y2,dy3=y0-y1+y2-y3;
    var a,b,c,d,e,f,g=0,h=0;
    if (Math.abs(dx3)<1e-9 && Math.abs(dy3)<1e-9){ a=x1-x0;b=x2-x1;c=x0;d=y1-y0;e=y2-y1;f=y0; }
    else {
      var den=dx1*dy2-dx2*dy1;
      g=(dx3*dy2-dx2*dy3)/den; h=(dx1*dy3-dx3*dy1)/den;
      a=x1-x0+g*x1; b=x3-x0+h*x3; c=x0; d=y1-y0+g*y1; e=y3-y0+h*y3; f=y0;
    }
    return [a,b,c,d,e,f,g,h,1];
  }
  function adj(m){
    var a=m[0],b=m[1],c=m[2],d=m[3],e=m[4],f=m[5],g=m[6],h=m[7],i=m[8];
    return [e*i-f*h, c*h-b*i, b*f-c*e, f*g-d*i, a*i-c*g, c*d-a*f, d*h-e*g, b*g-a*h, a*e-b*d];
  }
  function warp(src, q, W, H){
    var sw=src.width, sh=src.height, sd=src.getContext("2d").getImageData(0,0,sw,sh).data;
    var I=adj(sqToQuad(q));
    var out=document.createElement("canvas"); out.width=W; out.height=H;
    var oc=out.getContext("2d"), img=oc.createImageData(W,H), od=img.data;
    for (var y=0;y<H;y++) for (var x=0;x<W;x++){
      var X=x+.5, Y=y+.5, w=I[6]*X+I[7]*Y+I[8];
      var u=(I[0]*X+I[1]*Y+I[2])/w, v=(I[3]*X+I[4]*Y+I[5])/w;
      if (!(u>=0 && u<1 && v>=0 && v<1)) continue;
      var fx=u*sw-.5, fy=v*sh-.5, ix=Math.floor(fx), iy=Math.floor(fy), tx=fx-ix, ty=fy-iy;
      var R=0,G=0,B=0,A=0;
      for (var j=0;j<2;j++){
        var yy=Math.min(sh-1,Math.max(0,iy+j)), wy=j?ty:1-ty;
        for (var k=0;k<2;k++){
          var xx=Math.min(sw-1,Math.max(0,ix+k)), wt=(k?tx:1-tx)*wy, p=(yy*sw+xx)*4, al=sd[p+3]*wt;
          R+=sd[p]*al; G+=sd[p+1]*al; B+=sd[p+2]*al; A+=al;
        }
      }
      if (A>0){ var o=(y*W+x)*4; od[o]=R/A; od[o+1]=G/A; od[o+2]=B/A; od[o+3]=A; }
    }
    oc.putImageData(img,0,0);
    return out;
  }
  function trim(c){
    var w=c.width,h=c.height,d=c.getContext("2d").getImageData(0,0,w,h).data;
    var x0=w,y0=h,x1=-1,y1=-1;
    for (var y=0;y<h;y++) for (var x=0;x<w;x++) if (d[(y*w+x)*4+3]>8){
      if (x<x0)x0=x; if (x>x1)x1=x; if (y<y0)y0=y; if (y>y1)y1=y;
    }
    if (x1<0) return c;
    var o=document.createElement("canvas"); o.width=x1-x0+1; o.height=y1-y0+1;
    o.getContext("2d").drawImage(c,-x0,-y0);
    return o;
  }
  // generator defaults: flare 14 %, height 130 %
  function doors3d(text, size, flare){
    var L=flat(text,size), p=(flare==null?.14:flare), dh=L.height*1.30;
    var lt=L.width*(1-p), lb=L.width*(1+p), W=Math.ceil(L.width*(1+p)), H=Math.ceil(dh);
    var res=warp(L,[(W-lt)/2,(H-dh)/2,(W+lt)/2,(H-dh)/2,(W+lb)/2,(H+dh)/2,(W-lb)/2,(H+dh)/2],W,H);
    return trim(res);
  }
  var cache = {};
  function art(text, size, flare){
    var k = text + "@" + size;
    return cache[k] || (cache[k] = doors3d(text, size, flare));
  }
  function paint(canvas, text, size, label, flare){
    var src = art(text, size, flare);
    canvas.width = src.width; canvas.height = src.height;
    canvas.getContext("2d").drawImage(src,0,0);
    canvas.setAttribute("aria-label", label || text);
  }

  /* ---------- rendering ---------- */
  var app=$("app"), go=$("go"), numC=$("num"), lblC=$("lbl"), roomEl=$("room"), nextEl=$("next"), nextName=$("nextName"), live=$("live");
  var bgA=$("bgA"), bgB=$("bgB"), bgOn=null, bgKey="";
  var NUM_SIZE=380, LBL_SIZE=300, GG_SIZE=380;

  function setBg(key){
    if (key === bgKey) return;
    bgKey = key;
    var next = (bgOn === bgA) ? bgB : bgA, prev = bgOn;
    next.style.backgroundImage = 'url("assets/bg-' + key + '.jpg")';
    next.classList.add("on");
    if (prev) prev.classList.remove("on");
    bgOn = next;
    document.querySelector(".bg").style.setProperty("--scrim", SCRIM[key] || 0);
  }

  function hintFor(door){
    var n = door + 1;
    if (state.phase === "chase") return door === CHASE_END - 1 ? SPECIAL[CHASE_END] : "";
    if (n > LAST_DOOR || !SPECIAL[n]) return "";
    if (n > CHASE_FIRST && n < CHASE_END) return "";   // inside the chase: no hints
    if (n === CHASE_FIRST) return "";                   // start button handles this
    return SPECIAL[n];
  }

  var shown = { door:null, phase:null };
  function render(){
    var door = state.door, gg = state.phase === "gg";
    app.classList.toggle("gg", gg);

    if (gg){
      numC.classList.add("gg");
      paint(numC, "GG!", GG_SIZE, "GG!");
      setBg("200");
      live.textContent = "GG!";
      shown = { door:door, phase:"gg" };
      return;
    }
    numC.classList.remove("gg");
    paint(lblC, "DOOR", LBL_SIZE, "Door", .04);
    paint(numC, String(door), NUM_SIZE, String(door));

    var name = SPECIAL[door] || "";
    roomEl.textContent = name;

    var hint = hintFor(door);
    nextEl.classList.toggle("show", !!hint);
    if (hint) nextName.textContent = hint;

    // button
    var label, disabled = false, small = false;
    if (state.phase === "chase"){ label = "We will open doors for you"; disabled = true; small = true; }
    else if (door === CHASE_START){ label = "LET'S START THE CHASE!!!!!!!!"; small = true; }
    else if (door === LAST_DOOR){ label = "THE FINAL MOMENT"; }
    else label = "OPEN THE DOOR";
    go.textContent = label; go.disabled = disabled; go.classList.toggle("small", small);

    setBg(bgFor(door));
    if (shown.door !== door) live.textContent = "Door " + door + (name ? ", " + name : "");
    shown = { door:door, phase:state.phase };
    // warm the cache for the next door so the tap feels instant
    if (door < LAST_DOOR && state.phase === "normal") idle(function(){ art(String(door+1), NUM_SIZE); });
  }
  function idle(fn){ (window.requestIdleCallback || function(f){ setTimeout(f,60); })(fn); }

  /* ---------- actions ---------- */
  var lastTap = 0;
  function press(){
    var now = Date.now(); if (now - lastTap < 160) return; lastTap = now;
    wake();
    if (state.phase === "gg" || state.phase === "chase") return;
    if (state.door === CHASE_START){
      state = { door:CHASE_FIRST, phase:"chase", chaseStart:now };
    } else if (state.door === LAST_DOOR){
      state = { door:LAST_DOOR, phase:"gg", chaseStart:0 };
    } else {
      state.door += 1;
    }
    save(); render();
  }

  function chaseDoor(elapsedMs){
    var steps = CHASE_END - CHASE_FIRST;                 // 9 steps between 141 and 150
    var per = CHASE_SECONDS * 1000 / steps;
    return Math.min(CHASE_END, CHASE_FIRST + Math.floor(elapsedMs / per));
  }
  function tick(){
    if (state.phase !== "chase") return;
    var d = chaseDoor(Date.now() - state.chaseStart);
    if (d >= CHASE_END){ state = { door:CHASE_END, phase:"normal", chaseStart:0 }; save(); render(); }
    else if (d !== state.door){ state.door = d; save(); render(); }
  }
  setInterval(tick, 250);
  document.addEventListener("visibilitychange", function(){ if (!document.hidden){ tick(); wake(); } });

  function back(){
    if (state.phase !== "normal" || state.door <= START_DOOR) return;
    var t = state.door - 1;
    if (t > CHASE_FIRST - 1 && t < CHASE_END) return;   // can't step back into the chase
    state.door = t; save(); render();
  }
  function reset(){ state = { door:START_DOOR, phase:"normal", chaseStart:0 }; save(); render(); }

  /* hidden gestures: hold the door number = one door back, hold the logo = start over */
  function holdable(el, ms, fn){
    var t = null, fired = false;
    function clear(){ if (t){ clearTimeout(t); t = null; } }
    el.addEventListener("pointerdown", function(){ fired = false; clear(); t = setTimeout(function(){ fired = true; if (navigator.vibrate) navigator.vibrate(30); fn(); }, ms); });
    ["pointerup","pointercancel","pointerleave"].forEach(function(e){ el.addEventListener(e, clear); });
    el.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  }
  holdable(numC, 800, back);
  holdable($("brand"), 1200, reset);

  go.addEventListener("click", press);
  document.addEventListener("keydown", function(e){
    if (e.key === "Backspace"){ back(); }
  });

  /* keep the iPad awake while playing */
  var lock = null;
  function wake(){
    if (!navigator.wakeLock || lock) return;
    navigator.wakeLock.request("screen").then(function(l){ lock = l; l.addEventListener("release", function(){ lock = null; }); }).catch(function(){});
  }

  /* preload every background so room changes are instant */
  BGS.forEach(function(b){ var i = new Image(); i.src = "assets/bg-" + b[2] + ".jpg"; });

  /* ---------- start ---------- */
  load();
  var fontsReady = document.fonts && document.fonts.load
    ? Promise.all([document.fonts.load("100px DoorsRevamped","0123456789DOR!"), document.fonts.load("40px DoorsRevamped","Open the door")])
    : Promise.resolve();
  fontsReady.catch(function(){}).then(function(){
    tick(); render();
    requestAnimationFrame(function(){ app.classList.add("ready"); });
  });
})();
</script>
</body>
</html>
